name: Deploy Grubify API

on:
  push:
    branches: [main]
    paths:
      - GrubifyApi/**
      - .github/workflows/deploy-grubify-api.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: grubify-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable image
        run: |
          REGISTRY="${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io"
          az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}"
          docker build \
            --tag "${REGISTRY}/grubify-api:${GITHUB_SHA}" \
            --file GrubifyApi/Dockerfile \
            GrubifyApi
          docker push "${REGISTRY}/grubify-api:${GITHUB_SHA}"

      - name: Deploy image
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.GRUBIFY_API_CONTAINER_APP }}" \
            --image "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/grubify-api:${GITHUB_SHA}" \
            --output none

      - name: Verify health
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.GRUBIFY_API_CONTAINER_APP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "https://${FQDN}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Health verification failed after 180 seconds" >&2
          exit 1